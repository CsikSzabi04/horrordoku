<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIGHTDOKU</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0a0d; --fg: #e8e2e4; --muted: #8d8189; --blood: #b3122d; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif;
           display: grid; place-items: center; text-align: center; padding: 0 16px; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: .12em; margin: 0 0 .25em; }
    h1 span { color: var(--blood); }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>NIGH<span>T</span>DOKU</h1>
    <p>Ahol a sudoku vért ont. A letöltés hamarosan itt lesz.</p>
  </main>
</body>
</html>
